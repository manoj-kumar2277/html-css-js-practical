<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Functions - JavaScript Program</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #2c3e50; }
    p.description { color: #555; margin-bottom: 20px; }
    .inputs { margin: 15px 0; }
    .inputs input, .inputs textarea {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      width: 200px;
    }
    #output {
      font-size: 18px;
      font-weight: bold;
      color: #2980b9;
      margin: 20px 0;
      min-height: 30px;
      word-wrap: break-word;
      white-space: pre-wrap;
      text-align: left;
      background: #f0f6fb;
      padding: 10px;
      border-radius: 6px;
    }
    button {
      background: #2980b9;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #1c5d8a; }
    nav { margin-top: 20px; }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #2980b9;
      font-weight: bold;
    }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>JavaScript Functions</h1>
    <p class="description">Demonstrates a named function, a function expression, and a function with a default parameter.</p>

    <div class="inputs">
      <input type="text" id="nameInput" placeholder="Enter your name" />
    </div>
    <button onclick="runFunctionsDemo()">Run Demo</button>

    <div id="output"></div>

    <nav>
      <a href="../index.html">Home</a>
      <a href="index.html">JavaScript Programs</a>
    </nav>
  </div>

  <script>
    // Named function declaration
    function greetNamed(name) {
      return "Hello (named function), " + name + "!";
    }

    // Function expression
    const greetExpression = function(name) {
      return "Hello (function expression), " + name + "!";
    };

    // Function with a default parameter
    function greetDefault(name = "Guest") {
      return "Hello (default parameter), " + name + "!";
    }

    function runFunctionsDemo() {
      const name = document.getElementById("nameInput").value.trim();
      const outputDiv = document.getElementById("output");

      outputDiv.textContent =
        greetNamed(name || "Friend") + "\n" +
        greetExpression(name || "Friend") + "\n" +
        greetDefault(name || undefined);
    }
  </script>
</body>
</html>
