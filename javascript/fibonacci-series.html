<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fibonacci Series - JavaScript Program</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #2c3e50; }
    p.description { color: #555; margin-bottom: 20px; }
    .inputs { margin: 15px 0; }
    .inputs input, .inputs textarea {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      width: 200px;
    }
    #output {
      font-size: 18px;
      font-weight: bold;
      color: #2980b9;
      margin: 20px 0;
      min-height: 30px;
      word-wrap: break-word;
      white-space: pre-wrap;
      text-align: left;
      background: #f0f6fb;
      padding: 10px;
      border-radius: 6px;
    }
    button {
      background: #2980b9;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #1c5d8a; }
    nav { margin-top: 20px; }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #2980b9;
      font-weight: bold;
    }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fibonacci Series</h1>
    <p class="description">Enter how many terms of the Fibonacci series you want to generate.</p>

    <div class="inputs">
      <input type="number" id="num1" placeholder="Number of terms" min="1" />
    </div>
    <button onclick="generateFibonacci()">Generate</button>

    <div id="output"></div>

    <nav>
      <a href="../index.html">Home</a>
      <a href="index.html">JavaScript Programs</a>
    </nav>
  </div>

  <script>
    // Generate the Fibonacci series up to n terms
    function generateFibonacci() {
      const n = parseInt(document.getElementById("num1").value);
      const outputDiv = document.getElementById("output");

      if (isNaN(n) || n < 1) {
        outputDiv.textContent = "Please enter a valid number of terms.";
        return;
      }

      let series = [];
      let a = 0, b = 1;
      for (let i = 0; i < n; i++) {
        series.push(a);
        const next = a + b;
        a = b;
        b = next;
      }

      outputDiv.textContent = "Fibonacci Series: " + series.join(", ");
    }
  </script>
</body>
</html>
