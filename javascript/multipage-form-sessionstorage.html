<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Page Form Using sessionStorage - JavaScript Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12111a; --panel:#1b1a26; --panel-alt:#221f30; --line:#322f42;
  --text:#eae7f2; --text-dim:#9c96ad; --amber:#e8a33d; --teal:#4fd1c5; --coral:#ff6b7a;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;margin:0 0 .4em;}
code,.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--teal);}
.wrap{max-width:640px;margin:0 auto;padding:2.4rem 1.4rem 4rem;}
.topbar{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--text-dim);margin-bottom:1.5rem;}
.topbar a{color:var(--text-dim);text-decoration:none;}
.topbar a:hover{color:var(--teal);}
.eyebrow{color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:.8rem;}
h1.ptitle{font-size:clamp(1.4rem,3vw,1.9rem);margin-top:.2rem;}
p.desc{color:var(--text-dim);max-width:62ch;margin-bottom:1.5rem;font-size:.9rem;}
.demo{background:var(--panel-alt);border:1px solid var(--line);border-radius:14px;padding:1.4rem;margin-bottom:1.5rem;}
label{display:block;font-size:.78rem;color:var(--text-dim);margin-bottom:.3rem;margin-top:.8rem;}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:.6rem .8rem;border-radius:8px;font-size:.88rem;box-sizing:border-box;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);}
.err{color:var(--coral);font-size:.76rem;margin-top:.3rem;min-height:1em;}
.ok{color:var(--teal);font-size:.76rem;margin-top:.3rem;}
button{background:var(--teal);color:#0b0b12;border:none;padding:.65rem 1.2rem;border-radius:8px;font-weight:600;font-size:.86rem;cursor:pointer;margin-top:1.1rem;}
button:hover{opacity:.9;}
button.secondary{background:var(--panel);border:1px solid var(--line);color:var(--text);margin-left:.5rem;}
.output{margin-top:1rem;padding:.8rem 1rem;background:var(--panel);border-radius:9px;font-size:.85rem;color:var(--text-dim);min-height:1.4rem;}
.success-msg{color:var(--teal);background:#12291f;border-radius:8px;padding:.6rem .9rem;font-size:.85rem;margin-top:.8rem;}
.navrow{display:flex;justify-content:space-between;gap:1rem;margin-top:1.6rem;border-top:1px solid var(--line);padding-top:1.2rem;}
.navrow a{font-family:'IBM Plex Mono',monospace;font-size:.83rem;background:var(--panel-alt);border:1px solid var(--line);padding:.45rem .85rem;border-radius:8px;text-decoration:none;color:var(--text);}
.navrow a:hover{border-color:var(--teal);color:var(--teal);}

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="../index.html">&larr; Home</a>
    <span>javascript/</span>
    <a href="index.html">All JS topics</a>
  </div>
  <span class="eyebrow">Web Storage</span>
  <h1 class="ptitle">Multi-Page Form Using sessionStorage</h1>
  <p class="desc">Step 1 of a form saves its data to sessionStorage so a later step/page could read it.</p>
  <div class="demo">
    <label>Your Name (Step 1)</label>
    <input type="text" id="mp-name" oninput="saveStep1()">
    <div class="output" id="mp-out"></div>
  </div>
  <div class="navrow">
    <a href="temp-form-data-sessionstorage.html">&larr; W19</a>
    <a href="autosave-form-localstorage.html">W21 &rarr;</a>
  </div>
</div>
<script>
document.getElementById('mp-name').value = sessionStorage.getItem('step1Name') || '';
function saveStep1() {
  sessionStorage.setItem('step1Name', document.getElementById('mp-name').value);
  document.getElementById('mp-out').textContent = 'Step 1 data saved - would carry to Step 2 in the same tab.';
}
</script>
</body>
</html>
