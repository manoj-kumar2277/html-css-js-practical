<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>68. Modal & Dialog Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#12111a; --panel:#1b1a26; --panel-alt:#221f30; --line:#322f42;
  --text:#eae7f2; --text-dim:#9c96ad; --amber:#e8a33d; --teal:#4fd1c5; --coral:#ff6b7a;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;margin:0 0 .4em;}
code,.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--teal);}
.wrap{max-width:820px;margin:0 auto;padding:2.5rem 1.4rem 4rem;}
.topbar{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--text-dim);margin-bottom:1.6rem;}
.topbar a{color:var(--text-dim);text-decoration:none;}
.topbar a:hover{color:var(--teal);}
.eyebrow{color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:.85rem;}
h1.title{font-size:clamp(1.5rem,3vw,2.1rem);margin-top:.2rem;}
p.desc{color:var(--text-dim);max-width:62ch;margin-bottom:1.6rem;}
.demo{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.6rem;margin-bottom:2rem;overflow:hidden;}
.navrow{display:flex;justify-content:space-between;gap:1rem;margin-top:2.4rem;border-top:1px solid var(--line);padding-top:1.4rem;}
.navrow a{font-family:'IBM Plex Mono',monospace;font-size:.85rem;background:var(--panel-alt);border:1px solid var(--line);padding:.5rem .9rem;border-radius:8px;text-decoration:none;color:var(--text);}
.navrow a:hover{border-color:var(--teal);color:var(--teal);}
.navrow a.disabled{opacity:.35;pointer-events:none;}


   .modal-backdrop{background:rgba(0,0,0,.55);border-radius:12px;padding:2rem 1rem;display:flex;justify-content:center;}
   .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:320px;}
   .modal-head{padding:1rem 1.2rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
   .modal-head h4{margin:0;font-size:.95rem;}
   .modal-body{padding:1rem 1.2rem;font-size:.85rem;color:var(--text-dim);}
   .modal-foot{padding:.9rem 1.2rem;display:flex;justify-content:flex-end;gap:.6rem;border-top:1px solid var(--line);}

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="../index.html">&larr; Home</a>
    <span>CSS Practical Programs</span>
    <a href="index.html">All CSS topics</a>
  </div>
  <span class="eyebrow">Topic 68</span>
  <h1 class="title">Modal & Dialog Component</h1>
  <p class="desc">A centered modal dialog with a dimmed backdrop, header, body, and footer actions, shown open for demonstration.</p>
  <div class="demo">
    <div class="modal-backdrop">
      <div class="modal">
        <div class="modal-head"><h4>Invite teammate</h4><span style="color:var(--text-dim);cursor:pointer;">&times;</span></div>
        <div class="modal-body">Enter an email address to send an invitation to your workspace.</div>
        <div class="modal-foot">
          <button class="btn btn-secondary" style="padding:.5rem 1rem;border-radius:7px;background:var(--panel-alt);border:1px solid var(--line);color:var(--text);font-size:.82rem;">Cancel</button>
          <button class="btn btn-primary" style="padding:.5rem 1rem;border-radius:7px;background:var(--teal);border:none;color:#0b0b12;font-weight:600;font-size:.82rem;">Send Invite</button>
        </div>
      </div>
    </div>

  </div>
  <div class="navrow">
    <a href="67.html">&larr; 67</a>
    <a href="69.html">69 &rarr;</a>
  </div>
</div>
</body>
</html>
