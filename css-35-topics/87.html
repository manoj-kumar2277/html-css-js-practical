<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>87. Multi-Step Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#12111a; --panel:#1b1a26; --panel-alt:#221f30; --line:#322f42;
  --text:#eae7f2; --text-dim:#9c96ad; --amber:#e8a33d; --teal:#4fd1c5; --coral:#ff6b7a;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;margin:0 0 .4em;}
code,.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--teal);}
.wrap{max-width:820px;margin:0 auto;padding:2.5rem 1.4rem 4rem;}
.topbar{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--text-dim);margin-bottom:1.6rem;}
.topbar a{color:var(--text-dim);text-decoration:none;}
.topbar a:hover{color:var(--teal);}
.eyebrow{color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:.85rem;}
h1.title{font-size:clamp(1.5rem,3vw,2.1rem);margin-top:.2rem;}
p.desc{color:var(--text-dim);max-width:62ch;margin-bottom:1.6rem;}
.demo{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.6rem;margin-bottom:2rem;overflow:hidden;}
.navrow{display:flex;justify-content:space-between;gap:1rem;margin-top:2.4rem;border-top:1px solid var(--line);padding-top:1.4rem;}
.navrow a{font-family:'IBM Plex Mono',monospace;font-size:.85rem;background:var(--panel-alt);border:1px solid var(--line);padding:.5rem .9rem;border-radius:8px;text-decoration:none;color:var(--text);}
.navrow a:hover{border-color:var(--teal);color:var(--teal);}
.navrow a.disabled{opacity:.35;pointer-events:none;}


   .ms-card{background:var(--panel-alt);border-radius:14px;padding:1.5rem;max-width:320px;}
   .ms-steps{display:flex;gap:.4rem;margin-bottom:1.2rem;}
   .ms-steps span{flex:1;height:4px;border-radius:99px;background:var(--line);}
   .ms-steps span.done,.ms-steps span.active{background:var(--teal);}
   .f-field{margin-bottom:1rem;}
   .f-field label{display:block;font-size:.78rem;color:var(--text-dim);margin-bottom:.3rem;}
   .f-field input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:.55rem .7rem;border-radius:7px;font-size:.85rem;box-sizing:border-box;}
   .ms-nav{display:flex;justify-content:space-between;}
   .ms-nav button{padding:.5rem 1rem;border-radius:7px;font-size:.82rem;cursor:pointer;}
   .ms-nav .back{background:var(--panel);border:1px solid var(--line);color:var(--text);}
   .ms-nav .next{background:var(--teal);border:none;color:#0b0b12;font-weight:600;}

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="../index.html">&larr; Home</a>
    <span>CSS Practical Programs</span>
    <a href="index.html">All CSS topics</a>
  </div>
  <span class="eyebrow">Topic 87</span>
  <h1 class="title">Multi-Step Form</h1>
  <p class="desc">A multi-step form shown mid-flow with a stepper header and a single active step's fields.</p>
  <div class="demo">
    <div class="ms-card">
      <div class="ms-steps"><span class="done"></span><span class="active"></span><span></span></div>
      <div class="f-field"><label>Company Size</label><input type="text" placeholder="e.g. 11-50 employees"></div>
      <div class="ms-nav"><button class="back">Back</button><button class="next">Continue</button></div>
    </div>

  </div>
  <div class="navrow">
    <a href="86.html">&larr; 86</a>
    <a href="88.html">88 &rarr;</a>
  </div>
</div>
</body>
</html>
