<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>52. KPI & Metric Card Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#12111a; --panel:#1b1a26; --panel-alt:#221f30; --line:#322f42;
  --text:#eae7f2; --text-dim:#9c96ad; --amber:#e8a33d; --teal:#4fd1c5; --coral:#ff6b7a;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;margin:0 0 .4em;}
code,.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--teal);}
.wrap{max-width:820px;margin:0 auto;padding:2.5rem 1.4rem 4rem;}
.topbar{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--text-dim);margin-bottom:1.6rem;}
.topbar a{color:var(--text-dim);text-decoration:none;}
.topbar a:hover{color:var(--teal);}
.eyebrow{color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:.85rem;}
h1.title{font-size:clamp(1.5rem,3vw,2.1rem);margin-top:.2rem;}
p.desc{color:var(--text-dim);max-width:62ch;margin-bottom:1.6rem;}
.demo{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.6rem;margin-bottom:2rem;overflow:hidden;}
.navrow{display:flex;justify-content:space-between;gap:1rem;margin-top:2.4rem;border-top:1px solid var(--line);padding-top:1.4rem;}
.navrow a{font-family:'IBM Plex Mono',monospace;font-size:.85rem;background:var(--panel-alt);border:1px solid var(--line);padding:.5rem .9rem;border-radius:8px;text-decoration:none;color:var(--text);}
.navrow a:hover{border-color:var(--teal);color:var(--teal);}
.navrow a.disabled{opacity:.35;pointer-events:none;}


   .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;}
   .kpi-card{background:var(--panel-alt);border:1px solid var(--line);border-radius:12px;padding:1.1rem;}
   .kpi-card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem;}
   .kpi-card h4{font-size:.85rem;color:var(--text-dim);font-weight:500;margin:0;}
   .kpi-card .pct{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--amber);}
   .bar-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
   .bar-fill{height:100%;background:var(--teal);border-radius:99px;}

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="../index.html">&larr; Home</a>
    <span>CSS Practical Programs</span>
    <a href="index.html">All CSS topics</a>
  </div>
  <span class="eyebrow">Topic 52</span>
  <h1 class="title">KPI & Metric Card Component</h1>
  <p class="desc">A KPI card that pairs a target with progress toward it, using a slim progress bar rather than just a raw number.</p>
  <div class="demo">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="top"><h4>Quarterly Signups</h4><span class="pct">72%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:72%;"></div></div>
      </div>
      <div class="kpi-card">
        <div class="top"><h4>Support SLA</h4><span class="pct">94%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:94%;background:var(--amber);"></div></div>
      </div>
      <div class="kpi-card">
        <div class="top"><h4>Storage Used</h4><span class="pct">38%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:38%;background:var(--coral);"></div></div>
      </div>
    </div>

  </div>
  <div class="navrow">
    <a href="51.html">&larr; 51</a>
    <a href="53.html">53 &rarr;</a>
  </div>
</div>
</body>
</html>
