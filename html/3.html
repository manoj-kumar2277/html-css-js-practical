<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3. HTML Tables</title>
<style>
  body { font-family: Arial, sans-serif; background:#f1f5f9; color:#1e293b; max-width:850px; margin:40px auto; padding:0 20px; }
  h1 { color:#7209b7; text-align:center; }
  table { width:100%; border-collapse:collapse; margin:24px 0; box-shadow:0 2px 8px rgba(0,0,0,.1); }
  caption { font-weight:bold; font-size:1.1em; color:#3a0ca3; margin-bottom:8px; }
  th, td { border:2px solid #3a0ca3; padding:10px 14px; text-align:center; }
  th { background:#4361ee; color:white; }
  tr:nth-child(even) { background:#e0e7ff; }
  tr:nth-child(odd) { background:#ffffff; }
  .merged { background:#f72585; color:white; font-weight:bold; }
</style>
</head>
<body>

  <h1>Student Marks Table (with Merged Cells)</h1>

  <table>
    <caption>Semester Result Sheet</caption>
    <tr>
      <th>Name</th>
      <th colspan="2">Subject Marks</th>
      <th>Total</th>
    </tr>
    <tr>
      <th></th>
      <th>Maths</th>
      <th>Science</th>
      <th></th>
    </tr>
    <tr>
      <td>Arun</td>
      <td>88</td>
      <td>92</td>
      <td>180</td>
    </tr>
    <tr>
      <td>Priya</td>
      <td>95</td>
      <td>89</td>
      <td>184</td>
    </tr>
    <tr>
      <td class="merged" colspan="3">Class Average</td>
      <td class="merged">182</td>
    </tr>
  </table>

  <table>
    <caption>Row-span Example</caption>
    <tr>
      <th>Department</th>
      <th>Staff</th>
    </tr>
    <tr>
      <td rowspan="2">Computer Science</td>
      <td>Dr. Kumar</td>
    </tr>
    <tr>
      <td>Prof. Meena</td>
    </tr>
    <tr>
      <td>Mathematics</td>
      <td>Dr. Rao</td>
    </tr>
  </table>

  <nav style="margin-top:30px; padding-top:15px; border-top:2px solid #0f6674;">
    <a href="../index.html" style="margin-right:15px; color:#0f6674; font-weight:bold; text-decoration:none;">🏠 Home</a>
    <a href="index.html" style="color:#0f6674; font-weight:bold; text-decoration:none;">⬅ Back to HTML Programs</a>
  </nav>

</body>
</html>
