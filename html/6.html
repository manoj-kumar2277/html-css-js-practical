<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>6. Audio and Video</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background:#03071e; color:#ffba08; max-width:800px; margin:40px auto; padding:0 20px; text-align:center; }
  h1 { color:#f48c06; }
  h2 { color:#ffba08; }
  .box { background:#370617; padding:20px; border-radius:12px; margin:24px 0; }
  iframe.yt-video { width:100%; max-width:500px; aspect-ratio:16/9; height:auto; border-radius:10px; border:3px solid #dc2f02; }
  audio { width:100%; max-width:500px; margin-top:10px; }
</style>
</head>
<body>

  <h1>Audio &amp; Video Elements</h1>

  <div class="box">
    <h2>Video Player (YouTube Embed)</h2>
    <iframe class="yt-video"
      src="https://www.youtube.com/embed/O6bk4eueLJc"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <div class="box">
    <h2>Audio Player (YouTube Embed)</h2>
    <iframe class="yt-video"
      src="https://www.youtube.com/embed/O6bk4eueLJc"
      title="YouTube audio player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <nav style="margin-top:30px; padding-top:15px; border-top:2px solid #0f6674;">
    <a href="../index.html" style="margin-right:15px; color:#0f6674; font-weight:bold; text-decoration:none;">🏠 Home</a>
    <a href="index.html" style="color:#0f6674; font-weight:bold; text-decoration:none;">⬅ Back to HTML Programs</a>
  </nav>

</body>
</html>
