<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>9. HTML5 Input Types</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background:#e9f5db; color:#31572c; max-width:600px; margin:40px auto; padding:0 20px; }
  h1 { text-align:center; color:#132a13; }
  form { background:white; padding:24px 30px; border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,.1); }
  label { display:block; margin:14px 0 4px; font-weight:bold; color:#31572c; }
  input { width:100%; padding:8px 10px; border:2px solid #90a955; border-radius:6px; box-sizing:border-box; }
  input:focus { border-color:#4f772d; outline:none; }
  button { margin-top:20px; width:100%; padding:12px; background:#4f772d; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
  button:hover { background:#31572c; }
</style>
</head>
<body>

  <h1>HTML5 Input Types</h1>

  <form>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="pwd">Password</label>
    <input type="password" id="pwd" placeholder="Enter password">

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob">

    <label for="age">Age (Number)</label>
    <input type="number" id="age" min="1" max="100">

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" placeholder="+91 98765 43210">

    <label for="site">Website (URL)</label>
    <input type="url" id="site" placeholder="https://example.com">

    <label for="vol">Volume (Range)</label>
    <input type="range" id="vol" min="0" max="100">

    <label for="fav">Favorite Color</label>
    <input type="color" id="fav" value="#4f772d">

    <label for="time">Preferred Time</label>
    <input type="time" id="time">

    <label for="search">Search</label>
    <input type="search" id="search" placeholder="Search here...">

    <button type="submit">Submit</button>
  </form>

  <nav style="margin-top:30px; padding-top:15px; border-top:2px solid #0f6674;">
    <a href="../index.html" style="margin-right:15px; color:#0f6674; font-weight:bold; text-decoration:none;">🏠 Home</a>
    <a href="index.html" style="color:#0f6674; font-weight:bold; text-decoration:none;">⬅ Back to HTML Programs</a>
  </nav>

</body>
</html>
