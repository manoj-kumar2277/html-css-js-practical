<!DOCTYPE html>
<!--
  Experiment: Create a realtime chat application.
  Prereq : schema.sql (messages table) + 01-enable-supabase-realtime.sql. Fill in the two constants and open in TWO browser tabs.
  Note   : uses the open policies from schema.sql. After running 06-authorization/06-*.sql, posting requires login (see project 4).
-->
<html>
<head>
  <meta charset="utf-8"><title>Realtime Chat</title>
  <style>
    body{font-family:Arial;background:#eef2f7;display:flex;justify-content:center}
    #chat{width:460px;margin-top:24px;background:#fff;border-radius:10px;box-shadow:0 2px 8px #0002;display:flex;flex-direction:column;height:80vh}
    header{padding:12px;background:#3b82f6;color:#fff;border-radius:10px 10px 0 0}
    #log{flex:1;overflow:auto;padding:10px}
    .m{margin:6px 0;padding:8px 10px;border-radius:10px;background:#f1f5f9;max-width:80%}
    .me{background:#dbeafe;margin-left:auto}.m small{color:#666;display:block}
    footer{display:flex;padding:8px;border-top:1px solid #ddd}footer input{flex:1;padding:8px}footer button{padding:8px 14px}
  </style>
</head>
<body>
<div id="chat">
  <header>Realtime Chat - <span id="status">connecting...</span></header>
  <div id="log"></div>
  <footer><input id="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const username = prompt('Your name?') || 'guest-' + Math.floor(Math.random() * 1000);
  const $ = (id) => document.getElementById(id);

  function render(m) {
    const d = document.createElement('div');
    d.className = 'm' + (m.username === username ? ' me' : '');
    d.innerHTML = `<small>${m.username} - ${new Date(m.created_at).toLocaleTimeString()}</small>`;
    d.appendChild(document.createTextNode(m.content));          // textContent => prevents XSS
    $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
  }

  async function send() {
    const content = $('text').value.trim(); if (!content) return;
    $('text').value = '';
    const { error } = await sb.from('messages').insert({ username, content });
    if (error) alert(error.message);
  }

  (async () => {
    const { data } = await sb.from('messages').select('*').order('created_at', { ascending: false }).limit(50);
    (data || []).reverse().forEach(render);                      // history
    sb.channel('chat-room')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => render(p.new))   // live
      .subscribe((s) => ($('status').textContent = s === 'SUBSCRIBED' ? 'online' : s.toLowerCase()));
  })();
</script>
</body>
</html>
